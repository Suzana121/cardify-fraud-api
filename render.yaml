# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repo. It creates the API and a Postgres database.
services:
  - type: web
    name: cardify-fraud-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cardify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: cardify-db
    plan: free
    databaseName: cardify
    user: cardify
